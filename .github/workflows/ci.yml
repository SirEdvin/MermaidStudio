name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and test container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: mermaidstudio:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test dynamic port and isolation headers
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name smoke -e PORT=18763 -p 127.0.0.1:18763:18763 mermaidstudio:verify
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --retry 15 --retry-all-errors --retry-delay 1 --fail -D headers.txt http://127.0.0.1:18763/index.html -o index.html
          grep -qi 'Cross-Origin-Opener-Policy: same-origin' headers.txt
          grep -qi 'Cross-Origin-Embedder-Policy: require-corp' headers.txt
          grep -q 'MermaidStudio' index.html
          docker exec smoke nginx -t

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version and choose image name
        id: version
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create GitHub release after image publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # Markdown backticks are literal formatting.
          # shellcheck disable=SC2016
          printf 'Container: `%s:%s`\n\nDigest: `%s`\n\n' "$IMAGE" "$VERSION" "$DIGEST" > release-notes.md
          cat docs/fork-release-notes.md >> release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "MermaidStudio $VERSION" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "MermaidStudio $VERSION" --notes-file release-notes.md
          fi
